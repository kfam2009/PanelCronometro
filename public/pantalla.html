<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PanelCronometro · Pantalla</title>
<style>
  /* Diseno base 1920x640 (3:1); se escala al area elegida en el panel */
  :root{--y:#ffd400;--txt:#fff;--sub:#b9c0cc;--row:#0d0f15;--row2:#151924}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI","Inter",Arial,sans-serif;color:var(--txt);cursor:none}
  #box{position:absolute;overflow:hidden;background:#000}
  #stage{position:absolute;left:0;top:0;width:1920px;height:640px;transform-origin:0 0;display:flex}
  #cam{flex:none;width:853px;height:640px;position:relative;display:none;background:#05070b;overflow:hidden}
  .cam #cam{display:block}
  #cam video,#cam video-stream{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover!important;display:block}
  #cam .tag{position:absolute;left:18px;top:18px;z-index:2;background:#e3192c;color:#fff;font-weight:900;font-size:34px;letter-spacing:2px;padding:6px 18px;border-radius:6px;display:flex;align-items:center;gap:12px}
  #cam .tag::before{content:"";width:18px;height:18px;border-radius:50%;background:#fff;animation:bl 1s infinite}
  #cam .nosig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#59606d;font-size:40px;font-weight:800;letter-spacing:2px}
  @keyframes bl{50%{opacity:.2}}
  #cam::after{content:"";position:absolute;inset:0;border-right:8px solid var(--y);z-index:3;pointer-events:none}
  #info{flex:1;position:relative;background:#000;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(30px);transition:opacity .5s,transform .5s}
  .slide.on{opacity:1;transform:none}
  /* encabezado: Panel Go a la izquierda, titulo, Maxi Cronos a la derecha */
  .hd{height:84px;flex:none;display:flex;align-items:center;gap:22px;padding:0 24px;background:#0b0d12;border-bottom:6px solid var(--y);color:var(--y);font-weight:900;font-size:48px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
  .hd .pgo{height:52px;flex:none}
  .hd .tt{overflow:hidden;text-overflow:ellipsis}
  .hd .pg{font-size:28px;font-weight:800;color:var(--sub)}
  .hd .mx{height:66px;margin-left:auto;flex:none}
  .cols{height:40px;flex:none;display:grid;align-items:center;padding-right:24px;background:#1b1f2a;color:var(--sub);font-weight:800;font-size:22px;letter-spacing:2px;text-transform:uppercase}
  .list{flex:1;display:flex;flex-direction:column}
  .r,.cols{grid-template-columns:var(--g)}
  .r{flex:1;display:grid;align-items:center;padding-right:24px;background:var(--row);border-bottom:2px solid #1d2230;font-weight:800;font-size:40px;white-space:nowrap}
  .r:nth-child(even){background:var(--row2)}
  .r>*,.cols>*{overflow:hidden;text-overflow:ellipsis;padding-left:20px}
  .r .p{height:100%;display:flex;align-items:center;justify-content:center;padding:0;background:#1f2430;color:var(--y);font-weight:900;font-size:44px}
  .cols .p{text-align:center;padding:0}
  .r.podio .p{background:var(--y);color:#000}
  .r .n{text-transform:uppercase}
  .r .b,.r .d,.r .c{color:var(--sub);font-size:.82em}
  .r .t{text-align:right;font-variant-numeric:tabular-nums;color:var(--y);font-weight:900}
  .cols .t{text-align:right}
  .r.new{animation:flash 1.6s ease}
  @keyframes flash{0%,40%{background:#5a4b00}}
  .logos{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 50px}
  .logos img{max-width:100%;max-height:100%;object-fit:contain}
  .wait{flex:1;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:var(--sub)}
  /* llegada en grande */
  #arr .hd,#grp .hd{background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/34px 34px;border-bottom-color:#000}
  #arr .hd span.k,#grp .hd span.k{background:#000;color:var(--y);padding:4px 22px}
  #grp .hd .pg{background:#000;color:#fff;padding:4px 14px}
  .big{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:40px;row-gap:6px;align-content:center;padding:20px 40px}
  .big>*{min-width:0}
  .big .p{grid-row:1/4;align-self:center;background:var(--y);color:#000;font-weight:900;font-size:230px;line-height:1;padding:20px 34px;border-radius:14px;min-width:260px;text-align:center;letter-spacing:-6px}
  .big .n{font-weight:900;font-size:110px;line-height:1.02;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .big .t{font-weight:900;font-size:140px;color:var(--y);font-variant-numeric:tabular-nums;line-height:1}
  .big .m{font-weight:700;font-size:52px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .big .m b{color:#fff}
  .cam .big{column-gap:28px;padding:16px 28px}
  .cam .big .p{grid-row:1;font-size:150px;min-width:170px;padding:14px 22px}
  .cam .big .t{grid-row:1;grid-column:2;align-self:center;font-size:130px}
  .cam .big .n{grid-row:2;grid-column:1/3;font-size:84px}
  .cam .big .m{grid-row:3;grid-column:1/3;font-size:44px}
  #grp .r{animation:rowin .5s ease both}
  @keyframes rowin{from{opacity:0;transform:translateX(60px)}}
  #arr.on .p{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.3)}}
</style>
</head>
<body>
<div id="box"><div id="stage">
  <div id="cam"><span class="tag">EN VIVO</span><div class="nosig">SIN SEÑAL</div></div>
  <div id="info">
    <div class="slide" id="arr"><div class="hd"><span class="k">¡LLEGADA!</span><img class="mx" src="img/maxicronos.png" alt=""></div><div class="big"><div class="p" id="aP"></div><div class="n" id="aN"></div><div class="t" id="aT"></div><div class="m" id="aM"></div></div></div>
    <div class="slide" id="grp"></div>
    <div class="slide" id="rot"></div>
  </div>
</div></div>
<script>
const $ = s => document.querySelector(s), wait = ms => new Promise(r => setTimeout(r, ms));
const demo = new URLSearchParams(location.search).get('demo');
const ROWS = 7, LOGO_EVERY = 3;
let st = null, lastSeq = null, queue = [], showing = false, rotK = 0, logoK = 0, rotTimer = null, newest = null, camKey = '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const HD = (t, pg) => `<div class="hd"><img class="pgo" src="img/panelgo-mark.svg" alt=""><span class="tt">${t}</span>${pg ? `<span class="pg">${esc(pg)}</span>` : ''}<img class="mx" src="img/maxicronos.png" alt=""></div>`;

// Donde va la imagen 3:1 dentro de la ventana (la salida HDMI)
function area() {
  const W = innerWidth, H = innerHeight, b = Math.round(W / 3);
  switch (st.area) {
    case 'completa': return { x: 0, y: 0, w: W, h: H };
    case 'centro': return { x: 0, y: Math.max(0, Math.round((H - b) / 2)), w: W, h: b };
    case 'led': return { x: 0, y: 0, w: 768, h: 256 };
    case 'custom': return st.custom;
    default: return { x: 0, y: 0, w: W, h: b };
  }
}
function layout() {
  const A = area(), box = $('#box');
  Object.assign(box.style, { left: A.x + 'px', top: A.y + 'px', width: A.w + 'px', height: A.h + 'px' });
  $('#stage').style.transform = `scale(${A.w / 1920},${A.h / 640})`;
  document.documentElement.style.setProperty('--y', st.color || '#ffd400');
  document.body.classList.toggle('cam', Boolean(st.camara));
  setCamera(st.camara);
}
addEventListener('resize', () => st && layout());

// ---- Camara: IP por go2rtc (mismo origen /go2rtc) o USB/capturadora directo ----
let camStream = null;
async function setCamera(c) {
  const key = c ? `${c.tipo}:${c.id}:${c.usb}` : '';
  if (key === camKey) return; camKey = key;
  const box = $('#cam'); box.querySelectorAll('video,video-stream').forEach(e => e.remove());
  camStream?.getTracks().forEach(t => t.stop()); camStream = null;
  if (!c) return;
  try {
    if (c.tipo === 'ip') {
      if (!customElements.get('video-stream')) await import('/go2rtc/video-stream.js');
      const v = document.createElement('video-stream');
      v.mode = 'mse,mjpeg'; v.background = true;
      v.src = new URL(`/go2rtc/api/ws?src=cam_${encodeURIComponent(c.id)}`, location.href.replace(/^http/, 'ws'));
      box.prepend(v);
      setTimeout(() => { const vid = v.querySelector('video'); if (vid) { vid.muted = true; vid.style.objectFit = 'cover'; } }, 500);
    } else {
      // USB: se busca el dispositivo por nombre (hace falta un primer permiso para ver los nombres)
      const tmp = await navigator.mediaDevices.getUserMedia({ video: true }); tmp.getTracks().forEach(t => t.stop());
      const dev = (await navigator.mediaDevices.enumerateDevices()).find(d => d.kind === 'videoinput' && d.label === c.usb);
      camStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: dev ? { exact: dev.deviceId } : undefined, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      const v = document.createElement('video'); v.muted = true; v.autoplay = true; v.playsInline = true; v.srcObject = camStream;
      box.prepend(v);
    }
  } catch (e) { camKey = ''; console.log('camara', e); }
}

function fit(el, max, min) { let f = max; el.style.fontSize = f + 'px'; while (el.scrollWidth > el.clientWidth && f > min) el.style.fontSize = (f -= 4) + 'px'; }
// Columnas segun el espacio (con camara hay menos lugar)
function cols(kind) {
  const cam = document.body.classList.contains('cam');
  if (kind === 'ultimas') return cam
    ? { g: '96px minmax(0,1fr) 150px 220px', c: [['p', 'Pos'], ['n', 'Nombre'], ['d', 'Dist.'], ['t', 'Tiempo']] }
    : { g: '110px minmax(0,1fr) 150px 170px 160px 250px', c: [['p', 'Pos'], ['n', 'Nombre'], ['b', 'Dorsal'], ['d', 'Dist.'], ['c', 'Cat.'], ['t', 'Tiempo']] };
  return cam
    ? { g: '96px minmax(0,1fr) 130px 220px', c: [['p', 'Pos'], ['n', 'Nombre'], ['b', 'Dorsal'], ['t', 'Tiempo']] }
    : { g: '110px minmax(0,1fr) 170px 160px 250px', c: [['p', 'Pos'], ['n', 'Nombre'], ['b', 'Dorsal'], ['c', 'Cat.'], ['t', 'Tiempo']] };
}
const cell = (k, a) => k === 'p' ? (a.pos || '-') : k === 'n' ? a.nombre : k === 'b' ? (a.bib ? '#' + a.bib : '') : k === 'd' ? a.dist : k === 'c' ? (a.cat ? a.cat + '°' : '') : a.tiempo;

// Diapositivas: ultimas llegadas, posiciones de cada distancia de a ROWS, y cada LOGO_EVERY una de logos/publicidad
function slides() {
  const base = [];
  if (st.recientes.length) base.push({ t: 'Últimas llegadas', kind: 'ultimas', rows: st.recientes.slice(0, ROWS) });
  for (const [d, t] of Object.entries(st.tablas)) {
    const n = Math.ceil(t.length / ROWS);
    for (let i = 0; i < n; i++) base.push({ t: 'Posiciones ' + d, pg: n > 1 ? `${i + 1}/${n}` : '', rows: t.slice(i * ROWS, i * ROWS + ROWS) });
  }
  if (!base.length) base.push({ espera: true });
  const out = [];
  base.forEach((s, i) => { out.push(s); if (st.logos.length && (i + 1) % LOGO_EVERY === 0) out.push({ logo: true }); });
  if (st.logos.length && base.length % LOGO_EVERY) out.push({ logo: true });
  return out;
}
function drawSlide(s) {
  const el = $('#rot');
  if (s.logo) { const src = st.logos[logoK++ % st.logos.length]; el.innerHTML = `<div class="logos"><img src="${esc(src)}" alt=""></div>`; return; }
  if (s.espera) { el.innerHTML = HD(esc(st.evento || 'Resultados')) + '<div class="wait">Esperando llegadas...</div>'; return; }
  const C = cols(s.kind); el.style.setProperty('--g', C.g);
  el.innerHTML = HD(esc(s.t), s.pg) +
    `<div class="cols">${C.c.map(([k, l]) => `<span class="${k}">${l}</span>`).join('')}</div><div class="list">` +
    s.rows.map(a => `<div class="r${a.pos && a.pos <= 3 ? ' podio' : ''}${newest === a.pid ? ' new' : ''}">${C.c.map(([k]) => `<span class="${k}">${esc(cell(k, a))}</span>`).join('')}</div>`).join('') +
    Array.from({ length: ROWS - s.rows.length }, () => '<div class="r"></div>').join('') + '</div>';
}
function rotate() {
  clearTimeout(rotTimer);
  if (!showing) { const l = slides(); drawSlide(l[rotK % l.length]); rotK++; const r = $('#rot'); r.classList.remove('on'); void r.offsetWidth; r.classList.add('on'); }
  rotTimer = setTimeout(rotate, (st?.segundos || 8) * 1000);
}
async function arrival(a) {
  showing = true; $('#rot').classList.remove('on');
  $('#aP').textContent = a.pos ? a.pos + '°' : '✓'; $('#aN').textContent = a.nombre; $('#aT').textContent = a.tiempo || '';
  $('#aM').innerHTML = [a.dist && `<b>${esc(a.dist)}</b>`, a.bib && 'Dorsal ' + esc(a.bib), a.cat && 'Categoría ' + esc(a.cat) + '°'].filter(Boolean).join(' · ');
  const s = $('#arr'); s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');
  fit($('#aN'), document.body.classList.contains('cam') ? 84 : 110, 40);
  await wait(((st?.segundos || 8) + 2) * 1000);
  s.classList.remove('on'); showing = false; newest = a.pid;
}
// Varias llegadas juntas (3 o mas esperando): un solo cartel con todas
async function group(list) {
  showing = true; $('#rot').classList.remove('on');
  const el = $('#grp'), C = cols('ultimas'); el.style.setProperty('--g', C.g);
  el.innerHTML = `<div class="hd"><span class="k">¡LLEGADAS!</span><span class="pg">${list.length} corredores</span><img class="mx" src="img/maxicronos.png" alt=""></div>` +
    `<div class="cols">${C.c.map(([k, l]) => `<span class="${k}">${l}</span>`).join('')}</div><div class="list">` +
    list.map((a, i) => `<div class="r${a.pos && a.pos <= 3 ? ' podio' : ''}" style="animation-delay:${i * 0.15}s">${C.c.map(([k]) => `<span class="${k}">${esc(cell(k, a))}</span>`).join('')}</div>`).join('') +
    Array.from({ length: ROWS - list.length }, () => '<div class="r"></div>').join('') + '</div>';
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  await wait(((st?.segundos || 8) + 4) * 1000);
  el.classList.remove('on'); showing = false; newest = list[0].pid;
}
let running = false;
async function runQueue() {
  if (running) return; running = true; let any = false;
  try {
    while (queue.length) {
      any = true;
      if (queue.length >= 3) await group(queue.splice(0, ROWS).sort((a, b) => (a.pos ?? 1e9) - (b.pos ?? 1e9)));
      else await arrival(queue.shift());
    }
  } finally { running = false; showing = false; }
  if (any) { rotK = 0; rotate(); }
}

async function poll() {
  try {
    st = await fetch('/api/pantalla', { cache: 'no-store', signal: AbortSignal.timeout(3000) }).then(r => r.json());
    layout();
    if (lastSeq === null) { lastSeq = st.seq; rotate(); }
    else if (st.seq < lastSeq) lastSeq = st.seq;
    for (const f of st.feed) if (f.seq > lastSeq) queue.push(f.a);
    lastSeq = Math.max(lastSeq, st.seq); runQueue();
  } catch (e) {}
  setTimeout(poll, 400);
}
if (demo) {
  const names = ['Luciano Galvan', 'Franco Giménez', 'Emmanuel Garcia', 'Juárez David', 'Sebastian Araya', 'Tony Pires', 'Yonathan Guenuin'];
  const rows = names.map((n, i) => ({ pid: i, pos: i + 1, nombre: n, bib: String(253 - i * 3), dist: '16 KM', cat: (i % 3) + 1, tiempo: `1:${13 + i * 2}:0${i}` }));
  st = { area: 'completa', camara: demo.includes('cam') ? { id: 'x', tipo: 'demo' } : null, segundos: 600, recientes: rows, tablas: { '16 KM': rows }, logos: ['img/maxicronos.png'], color: '#ffd400' };
  camKey = 'demo'; layout();
  if (demo.includes('llegada')) arrival({ pos: 6, nombre: 'Dangelo Ríos Andrea De Los Angeles', bib: '1', dist: '6 KM', cat: 2, tiempo: '41:30' });
  else if (demo.includes('grupo')) group(rows.slice(0, 5));
  else if (demo.includes('tabla')) { drawSlide(slides()[1]); $('#rot').classList.add('on'); }
  else { drawSlide(slides()[0]); $('#rot').classList.add('on'); }
} else poll();
</script>
</body>
</html>
