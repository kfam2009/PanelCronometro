<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PanelCronometro</title>
<link rel="stylesheet" href="panel.css">
<script type="module" src="panel.js"></script>
</head>
<body>
<header class="top">
  <img class="brand-l" src="img/panelgo.png" alt="Panel Go">
  <div class="title"><b>PANTALLA DE LLEGADAS</b><span id="ver">PanelCronometro</span><span id="urls"></span></div>
  <img class="brand-r" src="img/maxicronos.png" alt="Maxi Cronos">
</header>

<main>
  <section class="card a-crono">
    <div class="head"><h2>Cronometraje</h2><span id="conn" class="pill">SIN LINK</span></div>
    <div class="row"><input id="link" autocomplete="off" placeholder="Link del presenter de RaceResult (https://events.raceresult.com/presenters/?event=...)"><button id="saveLink" class="btn go">GUARDAR</button></div>
    <p id="info" class="muted"></p>
  </section>

  <section class="card a-pant">
    <div class="head"><h2>Pantalla</h2><button id="open" class="btn go" title="La abre a pantalla completa en el segundo monitor (el HDMI de la LED). Para cerrarla: Alt+F4">ABRIR EN LA PANTALLA</button></div>
    <div class="prev"><iframe id="preview" src="pantalla.html?preview=1" allow="autoplay; encrypted-media" title="Vista de la pantalla" tabindex="-1"></iframe></div>
    <div class="opts">
      <label class="grow">Salida HDMI<select id="area"></select></label>
      <label>Página (seg)<input id="seg" type="number" min="3" max="30"></label>
      <label>Color<input id="color" type="color"></label>
    </div>
    <div id="custom" class="opts" hidden>
      <label>X<input id="cx" type="number"></label><label>Y<input id="cy" type="number"></label><label>Ancho<input id="cw" type="number"></label><label>Alto<input id="ch" type="number"></label>
      <button id="applyCustom" class="btn">APLICAR</button>
    </div>
  </section>

  <section class="card a-cams">
    <div class="head"><h2>Cámaras</h2><span id="g2r" class="pill"></span></div>
    <div class="opts">
      <label class="grow">En la pantalla<select id="camSel"></select></label>
      <label id="rotWrap">Cambiar cada (seg)<input id="rotSeg" type="number" min="5" max="600"></label>
    </div>
    <div id="cams" class="cams scroll"></div>
    <div class="row"><button id="addIp" class="btn" title="Dirección RTSP o SRT, ej. rtsp://usuario:clave@192.168.1.50:554/stream1">+ IP</button><button id="addUsb" class="btn" title="Cámara USB o capturadora conectada a esta PC">+ USB / CAPTURADORA</button><button id="saveCams" class="btn go" hidden>GUARDAR CÁMARAS</button></div>
  </section>

  <section class="card a-lleg">
    <div class="head"><h2>Llegadas</h2><span class="muted">últimas 15</span></div>
    <div id="list" class="list scroll"></div>
    <div class="row tests"><input id="bib" class="bib" placeholder="Dorsal" inputmode="numeric" autocomplete="off"><button id="sim" class="btn go">SIMULAR</button><button id="scan" class="btn" title="Trae los resultados que ya existan">CARGAR TODOS</button><button id="clear" class="btn del" title="Para empezar un evento nuevo">BORRAR</button></div>
  </section>

  <section class="card a-medios">
    <div class="head"><h2>Video y YouTube</h2><span id="aire" class="pill">RESULTADOS</span><button id="volver" class="btn del" hidden>VOLVER A RESULTADOS</button></div>
    <div class="row"><input id="yt" autocomplete="off" placeholder="Link de YouTube (video o en vivo)"><button id="addYt" class="btn">+ YOUTUBE</button><label class="btn upload">+ VIDEO<input id="vfile" type="file" accept="video/*,.mkv,.mov" hidden></label></div>
    <p id="subiendo" class="muted" hidden></p>
    <div id="medios" class="list scroll"></div>
    <div class="opts"><label>Ajuste<select id="ajuste"><option value="llenar">Llenar la pantalla (recorta)</option><option value="entero">Entero (con bordes)</option></select></label><label class="chk"><input id="sonido" type="checkbox">con sonido</label></div>
  </section>

  <section class="card a-logos">
    <div class="head"><h2>Logos y publicidad</h2><label class="btn upload">+ SUBIR<input id="file" type="file" accept="image/*" multiple hidden></label></div>
    <div id="logos" class="logos scroll" title="Tocá un logo para prenderlo o apagarlo. Rotan cada 3 páginas."></div>
  </section>
</main>
<div id="toast" hidden></div>
</body>
</html>
